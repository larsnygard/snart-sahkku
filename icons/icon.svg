  <g stroke="#ffd166" stroke-width="7" stroke-linecap="round">
    <line x1="140" y1="246" x2="152" y2="266"/>
    <line x1="152" y1="246" x2="140" y2="266"/>
    <line x1="360" y1="246" x2="372" y2="266"/>
    <line x1="372" y1="246" x2="360" y2="266"/>
  </g>
  <!-- brikker: røde (menn) nede, blå (koner) oppe -->
  <g fill="#e0453a"><rect x="100" y="300" width="24" height="44" rx="10"/><rect x="188" y="300" width="24" height="44" rx="10"/><rect x="356" y="300" width="24" height="44" rx="10"/></g>
  <g fill="#3f78d1"><rect x="132" y="168" width="24" height="44" rx="10" transform="rotate(180 144 190)"/><rect x="276" y="168" width="24" height="44" rx="10" transform="rotate(180 288 190)"/><rect x="388" y="168" width="24" height="44" rx="10" transform="rotate(180 400 190)"/></g>
  <!-- øvre og nedre broderibånd (gákti-inspirert sagtaskant) -->
  <path d="M64 436 l24 -24 24 24 24 -24 24 24 24 -24 24 24 24 -24 24 24 24 -24 24 24 24 -24 24 24 24 -24 24 24 24 -24 24 24 V512 H64 Z" fill="url(#band)"/>
  <path d="M64 76 l24 24 24 -24 24 24 24 -24 24 24 24 -24 24 24 24 -24 24 24 24 -24 24 24 24 -24 24 24 24 -24 24 24 24 -24 V0 H64 Z" fill="url(#band)"/>
