<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sun" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1d3a6e"/>
      <stop offset="100%" stop-color="#0c1730"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c1352b"/>
      <stop offset="100%" stop-color="#a02020"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sun)"/>
  <!-- solring (sámi flaggets sirkel, brutt) -->
  <path d="M 256 76 a 96 96 0 1 1 -0.1 0" fill="none" stroke="#ffd166" stroke-width="14" stroke-dasharray="452 151" stroke-linecap="round" transform="rotate(-38 256 172)"/>
  <!-- brettets midtrad med tallsyklus-linjer -->
  <g stroke="#eef2ff" stroke-width="10" stroke-linecap="round">
    <line x1="96" y1="256" x2="416" y2="256"/>
    <g>
      <line x1="112" y1="232" x2="112" y2="280"/>
      <line x1="152" y1="232" x2="152" y2="280"/>
      <line x1="192" y1="232" x2="192" y2="280"/>
      <line x1="232" y1="232" x2="232" y2="280"/>
      <line x1="280" y1="232" x2="280" y2="280"/>
      <line x1="320" y1="232" x2="320" y2="280"/>
      <line x1="360" y1="232" x2="360" y2="280"/>
      <line x1="400" y1="232" x2="400" y2="280"/>
    </g>
  </g>
  <!-- slottet: gullmerket i midten -->
  <circle cx="256" cy="256" r="17" fill="#ffd166"/>
